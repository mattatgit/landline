[package]
name = "landline-nix"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Landline NixOS/Linux client"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
base64 = "0.22"
cpal = "0.15.3"
dirs = "6"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.31.1", features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
iroh = "=1.0.2"
rodio = "0.20.1"
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
