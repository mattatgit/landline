name: Normalize macOS Add User source

on:
  push:
    branches:
      - feature/macos-add-user
    paths:
      - tools/fix_macos_add_user_newlines.py
      - .github/workflows/fix-macos-add-user-newlines.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/macos-add-user
          fetch-depth: 0

      - name: Normalize generated source
        run: python3 tools/fix_macos_add_user_newlines.py

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LandlineMac/ContentView.swift
          git rm tools/fix_macos_add_user_newlines.py .github/workflows/fix-macos-add-user-newlines.yml
          git commit -m "Normalize macOS Add User source"
          git push origin HEAD:feature/macos-add-user
