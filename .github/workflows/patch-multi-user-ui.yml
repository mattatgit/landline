name: Patch multi-user PTT UI hook

on:
  push:
    branches:
      - feature/macos-multi-user
    paths:
      - .github/workflows/patch-multi-user-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/macos-multi-user

      - name: Add local floor-revocation UI handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('LandlineMac/ContentView.swift')
          text = path.read_text()
          marker = "        .onDisappear {\n"
          if text.count(marker) < 1:
              raise SystemExit('Expected root onDisappear marker was not found; refusing to patch')
          hook = (
              "        .onChange(of: iroh.localTransmitGranted) { _, granted in\n"
              "            // In a near-simultaneous group PTT collision, IrohClient uses a\n"
              "            // deterministic endpoint-ID tie break. If this Mac loses while\n"
              "            // the physical PTT is still held, stop local capture immediately\n"
              "            // so the winning remote speaker can own the UI/floor.\n"
              "            if !granted, pttHeld, micState == .talking {\n"
              "                pttCaptureTask?.cancel()\n"
              "                pttCaptureTask = nil\n"
              "                networkPumpTask?.cancel()\n"
              "                networkPumpTask = nil\n"
              "                microphone.stopCapture()\n"
              "                micState = .muted\n"
              "            }\n"
              "        }\n"
          )
          if "onChange(of: iroh.localTransmitGranted)" in text:
              raise SystemExit('PTT floor-revocation hook already exists; refusing duplicate patch')
          path.write_text(text.replace(marker, hook + marker, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name "Matt Innes"
          git config user.email "matt@idealogue.io"
          git add LandlineMac/ContentView.swift
          git diff --cached --check
          git commit -m "Handle group PTT floor revocation in UI"
          git push origin HEAD:feature/macos-multi-user
