name: Package combined Multi-User UI build

'on':
  push:
    branches:
      - feature/macos-multi-user
    paths:
      - .github/workflows/package-combined-multi-user-ui.yml

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/macos-multi-user

      - name: Build Apple Silicon Release app
        run: |
          set -o pipefail
          xcodebuild \
            -project LandlineMac.xcodeproj \
            -scheme LandlineMac \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/LandlineDerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Sign and package test build
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/LandlineDerivedData/Build/Products/Release/LandlineMac.app"
          test -d "$APP"
          file "$APP/Contents/MacOS/LandlineMac" | grep -q 'arm64'
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ZIP="$RUNNER_TEMP/LandlineMac-MultiUser-v2-UI-Polish-Test-2026-09-10.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          mkdir "$RUNNER_TEMP/verify"
          ditto -x -k "$ZIP" "$RUNNER_TEMP/verify"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/verify/LandlineMac.app"

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: LandlineMac-MultiUser-v2-UI-Polish-Test-2026-09-10
          path: ${{ runner.temp }}/LandlineMac-MultiUser-v2-UI-Polish-Test-2026-09-10.zip
          if-no-files-found: error
          retention-days: 14
