name: Fix macOS hosting safe area

'on':
  push:
    branches:
      - feature/macos-ui-polish
    paths:
      - .github/workflows/fix-hosting-safe-area.yml

permissions:
  contents: write

jobs:
  apply-build-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/macos-ui-polish

      - name: Apply zero safe-area fix
        run: python3 .github/scripts/apply_zero_hosting_safe_area.py

      - name: Verify patch formatting
        run: git diff --check

      - name: Build Apple Silicon Release app
        run: |
          set -o pipefail
          xcodebuild \
            -project LandlineMac.xcodeproj \
            -scheme LandlineMac \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/LandlineDerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Sign and package test build
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/LandlineDerivedData/Build/Products/Release/LandlineMac.app"
          test -d "$APP"
          file "$APP/Contents/MacOS/LandlineMac" | grep -q 'arm64'
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/LandlineMac-UI-Polish-SafeArea-Test-2026-09-10.zip"
          mkdir "$RUNNER_TEMP/verify"
          ditto -x -k "$RUNNER_TEMP/LandlineMac-UI-Polish-SafeArea-Test-2026-09-10.zip" "$RUNNER_TEMP/verify"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/verify/LandlineMac.app"

      - name: Commit safe-area fix
        run: |
          git config user.name "Matt Innes"
          git config user.email "matt@idealogue.io"
          git add LandlineMac/LandlineMacApp.swift
          git diff --cached --check
          git commit -m "Remove hosting safe-area inset"
          git push origin HEAD:feature/macos-ui-polish

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: LandlineMac-UI-Polish-SafeArea-Test-2026-09-10
          path: ${{ runner.temp }}/LandlineMac-UI-Polish-SafeArea-Test-2026-09-10.zip
          if-no-files-found: error
          retention-days: 14
