name: Validate macOS microphone permission fix

on:
  push:
    branches: [main]
    paths:
      - 'LandlineMac/MicrophoneCapture.swift'
      - '.github/workflows/mac-mic-permission-fix.yml'

permissions:
  contents: write

jobs:
  build-test:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16.2
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Resolve packages
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project LandlineMac.xcodeproj \
            -scheme LandlineMac \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: Build Apple Silicon Release
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project LandlineMac.xcodeproj \
            -scheme LandlineMac \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/LandlineDerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Verify, sign and package
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/LandlineDerivedData/Build/Products/Release/LandlineMac.app"
          BIN="$APP/Contents/MacOS/LandlineMac"
          test -d "$APP"
          test -x "$BIN"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          file "$BIN" | tee "$RUNNER_TEMP/file.txt"
          grep -q 'arm64' "$RUNNER_TEMP/file.txt"
          xattr -cr "$APP"
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=4 "$APP"
          ZIP='LandlineMac-arm64-mic-permission-fix.zip'
          ditto -c -k --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          mkdir -p "$RUNNER_TEMP/roundtrip"
          ditto -x -k "$ZIP" "$RUNNER_TEMP/roundtrip"
          xattr -cr "$RUNNER_TEMP/roundtrip/LandlineMac.app"
          codesign --verify --deep --strict --verbose=4 "$RUNNER_TEMP/roundtrip/LandlineMac.app"

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: LandlineMac-arm64-mic-permission-fix
          path: |
            LandlineMac-arm64-mic-permission-fix.zip
            LandlineMac-arm64-mic-permission-fix.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/mac-mic-permission-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/mac-mic-permission-fix.yml
          git commit -m "Remove microphone permission validation workflow"
          git push origin HEAD:main
