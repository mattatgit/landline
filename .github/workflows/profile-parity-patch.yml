name: Patch Linux profile parity

on:
  push:
    branches:
      - linux-nix
    paths:
      - '.github/workflows/profile-parity-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: linux-nix
      - name: Apply parity patch
        run: python3 scripts/patch_profile_parity.py
      - name: Commit parity pass
        run: |
          rm .github/workflows/profile-parity-patch.yml
          rm scripts/patch_profile_parity.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align Linux settings and profile with macOS"
          git push origin HEAD:linux-nix
