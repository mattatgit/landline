name: Apply macOS Add User patch

on:
  push:
    branches:
      - feature/macos-add-user
    paths:
      - tools/apply_macos_add_user.py
      - .github/workflows/apply-macos-add-user.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/macos-add-user
          fetch-depth: 0

      - name: Apply verified source patch
        run: python3 tools/apply_macos_add_user.py

      - name: Commit generated Swift changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LandlineMac/ContentView.swift LandlineMac/IrohClient.swift
          git rm tools/apply_macos_add_user.py .github/workflows/apply-macos-add-user.yml
          git commit -m "Implement macOS Add User flow"
          git push origin HEAD:feature/macos-add-user
