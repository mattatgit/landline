name: Patch multi-user duplicate session handling

on:
  push:
    branches:
      - feature/macos-multi-user
    paths:
      - .github/workflows/patch-multi-user-duplicate-session.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/macos-multi-user

      - name: Make duplicate session selection deterministic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('LandlineMac/IrohClient.swift')
          text = path.read_text()

          replacements = [
              (
                  "        var peerID: String?\n        var receiveTask: Task<Void, Never>?\n",
                  "        var peerID: String?\n        let initiatedLocally: Bool\n        var receiveTask: Task<Void, Never>?\n"
              ),
              (
                  "        init(connection: Connection, send: SendStream, recv: RecvStream, peerID: String?) {\n            self.connection = connection\n            self.send = send\n            self.recv = recv\n            self.peerID = peerID\n        }\n",
                  "        init(\n            connection: Connection,\n            send: SendStream,\n            recv: RecvStream,\n            peerID: String?,\n            initiatedLocally: Bool\n        ) {\n            self.connection = connection\n            self.send = send\n            self.recv = recv\n            self.peerID = peerID\n            self.initiatedLocally = initiatedLocally\n        }\n"
              ),
              (
                  "                    recv: bi.recv(),\n                    expectedPeerID: trimmed\n                )\n",
                  "                    recv: bi.recv(),\n                    expectedPeerID: trimmed,\n                    initiatedLocally: true\n                )\n"
              ),
              (
                  "                        recv: bi.recv(),\n                        expectedPeerID: nil\n                    )\n",
                  "                        recv: bi.recv(),\n                        expectedPeerID: nil,\n                        initiatedLocally: false\n                    )\n"
              ),
              (
                  "        recv: RecvStream,\n        expectedPeerID: String?\n    ) {\n",
                  "        recv: RecvStream,\n        expectedPeerID: String?,\n        initiatedLocally: Bool\n    ) {\n"
              ),
              (
                  "            recv: recv,\n            peerID: expectedPeerID\n        )\n",
                  "            recv: recv,\n            peerID: expectedPeerID,\n            initiatedLocally: initiatedLocally\n        )\n"
              ),
              (
                  "        // If two clients manually initiate at the same time, keep whichever\n        // direct session was installed first and discard the duplicate.\n        if sessions.values.contains(where: { $0.id != sessionID && $0.peerID == remoteID }) {\n            removeSession(sessionID, clearParticipant: false)\n            return\n        }\n",
                  "        // If both clients manually initiate at the same time, both sides\n        // keep the same physical QUIC connection: the lower endpoint ID's\n        // outbound session. This avoids each Mac retaining opposite duplicates.\n        let duplicates = sessions.values.filter { $0.id != sessionID && $0.peerID == remoteID }\n        if !duplicates.isEmpty {\n            let shouldKeepLocallyInitiated = endpointId < remoteID\n            if session.initiatedLocally == shouldKeepLocallyInitiated {\n                for duplicate in duplicates {\n                    removeSession(duplicate.id, clearParticipant: false)\n                }\n            } else {\n                removeSession(sessionID, clearParticipant: false)\n                return\n            }\n        }\n"
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Expected IrohClient source block was not found; refusing to patch')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name "Matt Innes"
          git config user.email "matt@idealogue.io"
          git add LandlineMac/IrohClient.swift
          git diff --cached --check
          git commit -m "Resolve duplicate mesh sessions deterministically"
          git push origin HEAD:feature/macos-multi-user
