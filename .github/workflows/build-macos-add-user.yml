name: Build macOS Add User feature

on:
  push:
    branches:
      - feature/macos-add-user
    paths:
      - LandlineMac/**
      - LandlineMac.xcodeproj/**
      - .github/workflows/build-macos-add-user.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-arm64
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Build Release app
        run: |
          set -o pipefail
          xcodebuild \
            -project LandlineMac.xcodeproj \
            -scheme LandlineMac \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/LandlineDerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Verify arm64 executable
        run: |
          APP="$RUNNER_TEMP/LandlineDerivedData/Build/Products/Release/LandlineMac.app"
          test -d "$APP"
          file "$APP/Contents/MacOS/LandlineMac"
          file "$APP/Contents/MacOS/LandlineMac" | grep -q 'arm64'
