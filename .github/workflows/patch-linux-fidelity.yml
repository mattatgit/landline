name: Patch Linux UI fidelity

on:
  push:
    branches: [linux-nix]
    paths:
      - '.github/workflows/patch-linux-fidelity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: linux-nix
          fetch-depth: 0

      - name: Apply artwork, font and volume fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('LandlineNix/src/ui.rs')
          text = path.read_text()

          replacements = [
              (
                  'use std::{fs, path::PathBuf, time::{Duration, Instant}};',
                  'use std::{fs, path::PathBuf, sync::Arc, time::{Duration, Instant}};'
              ),
              (
                  '    self, Align2, Color32, FontId, Id, PointerButton, Pos2, Rect, Sense, Stroke, Vec2,\n',
                  '    self, Align2, Color32, FontData, FontDefinitions, FontFamily, FontId, Id, PointerButton, Pos2, Rect, Sense, Stroke, Vec2,\n'
              ),
              (
                  "    pub fn new(_cc: &eframe::CreationContext<'_>) -> Self {\n        let profile_name = load_profile_name();",
                  "    pub fn new(cc: &eframe::CreationContext<'_>) -> Self {\n        egui_extras::install_image_loaders(&cc.egui_ctx);\n        install_fonts(&cc.egui_ctx);\n\n        let profile_name = load_profile_name();"
              ),
              (
                  '''        painter.text(\n            title_rect.center(),\n            Align2::CENTER_CENTER,\n            "LANDLINE",\n            FontId::proportional(14.0),\n            Color32::WHITE,\n        );\n        painter.line_segment(\n            [pos2(title_rect.left() + 8.0, title_rect.bottom() - 3.0), pos2(title_rect.right() - 8.0, title_rect.bottom() - 3.0)],\n            Stroke::new(1.0, Color32::from_gray(145)),\n        );''',
                  '''        egui::Image::new(egui::include_image!("../assets/landline_title.svg"))\n            .fit_to_exact_size(title_rect.size())\n            .paint_at(ui, title_rect);'''
              ),
              (
                  '''        painter.circle_stroke(icon_rect.center(), 11.0 * scale, Stroke::new(1.4, Color32::WHITE));\n        painter.circle_filled(icon_rect.center() - vec2(0.0, 3.5), 3.2 * scale, Color32::WHITE);\n        painter.rect_filled(\n            Rect::from_center_size(icon_rect.center() + vec2(0.0, 4.2), vec2(9.0, 5.0) * scale),\n            3.0,\n            Color32::WHITE,\n        );''',
                  '''        egui::Image::new(egui::include_image!("../assets/profile_icon.png"))\n            .fit_to_exact_size(icon_rect.size())\n            .paint_at(ui, icon_rect);'''
              ),
              (
                  '''        painter.text(\n            ptt_center,\n            Align2::CENTER_CENTER,\n            if self.local_talking { "ON" } else { "MIC" },\n            FontId::proportional(12.0),\n            Color32::from_black_alpha(210),\n        );''',
                  '''        let ptt_icon = Rect::from_center_size(ptt_center, vec2(24.0, 24.0) * scale);\n        if self.local_talking {\n            egui::Image::new(egui::include_image!("../assets/mic_on.svg"))\n                .fit_to_exact_size(ptt_icon.size())\n                .paint_at(ui, ptt_icon);\n        } else {\n            egui::Image::new(egui::include_image!("../assets/mic_muted.svg"))\n                .fit_to_exact_size(ptt_icon.size())\n                .paint_at(ui, ptt_icon);\n        }'''
              ),
              (
                  'painter.text(panel.min + vec2(224.0, 19.0), Align2::RIGHT_CENTER, format!("{}", (self.volume * 100.0).round() as i32), FontId::proportional(13.0), Color32::WHITE);',
                  'painter.text(panel.min + vec2(248.0, 19.0), Align2::RIGHT_CENTER, format!("{}", (self.volume * 100.0).round() as i32), FontId::proportional(13.0), Color32::WHITE);'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected UI source block not found:\n{old[:180]}')
              text = text.replace(old, new, 1)

          marker = '#[derive(Clone, Copy)]\nenum ControlSymbol { Minimize, Maximize, Close }'
          font_setup = '''fn install_fonts(ctx: &egui::Context) {\n    let mut fonts = FontDefinitions::default();\n    fonts.font_data.insert(\n        "inter-tight".to_owned(),\n        Arc::new(FontData::from_static(include_bytes!(concat!(env!("OUT_DIR"), "/InterTight.ttf")))),\n    );\n    fonts.font_data.insert(\n        "inter".to_owned(),\n        Arc::new(FontData::from_static(include_bytes!(concat!(env!("OUT_DIR"), "/Inter.ttf")))),\n    );\n\n    let proportional = fonts.families.entry(FontFamily::Proportional).or_default();\n    proportional.insert(0, "inter".to_owned());\n    proportional.insert(0, "inter-tight".to_owned());\n    ctx.set_fonts(fonts);\n}\n\n'''
          if marker not in text:
              raise SystemExit('ControlSymbol marker not found')
          text = text.replace(marker, font_setup + marker, 1)
          path.write_text(text)

          Path('.github/workflows/patch-linux-fidelity.yml').unlink()

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use Landline artwork and embedded fonts on Linux"
          git push origin HEAD:linux-nix
