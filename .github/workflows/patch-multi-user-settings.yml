name: Patch multi-user Settings copy

on:
  push:
    branches:
      - feature/macos-multi-user
    paths:
      - .github/workflows/patch-multi-user-settings.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/macos-multi-user

      - name: Update group diagnostics state and copy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          client = Path('LandlineMac/IrohClient.swift')
          text = client.read_text()
          old = '''    var stateLabel: String {
        if let lastError, !lastError.isEmpty {
            return "Error: \\(lastError)"
        }
        if !endpointReady {
            return "Starting Iroh…"
        }
        if connectedPeerCount > 0 {
            return connectedPeerCount == 1
                ? "Connected to 1 peer"
                : "Connected to \\(connectedPeerCount) peers"
        }
        if connectionState == .connecting {
            return "Connecting…"
        }
        return "Ready — waiting for peers"
    }
'''
          new = '''    var stateLabel: String {
        if !endpointReady {
            return "Starting Iroh…"
        }
        if connectedPeerCount > 0 {
            return connectedPeerCount == 1
                ? "Connected to 1 peer"
                : "Connected to \\(connectedPeerCount) peers"
        }
        if connectionState == .connecting {
            return "Connecting…"
        }
        if let lastError, !lastError.isEmpty {
            return "Error: \\(lastError)"
        }
        return "Ready — waiting for peers"
    }
'''
          if old not in text:
              raise SystemExit('Expected stateLabel block not found; refusing patch')
          client.write_text(text.replace(old, new, 1))

          settings = Path('LandlineMac/IrohSettingsView.swift')
          text = settings.read_text()
          replacements = [
              ('Text("Iroh test connection")', 'Text("Iroh group diagnostics")'),
              ('Text("Temporary manual pairing for the first integrated Landline + Iroh build.")', 'Text("Manual endpoint pairing and diagnostics for the current Landline group mesh.")'),
              ('GroupBox("Peer")', 'GroupBox("Add peer")'),
              ('TextField("Paste the other Mac’s Endpoint ID", text: $peerEndpointID)', 'TextField("Paste another Mac’s Endpoint ID", text: $peerEndpointID)'),
              ('Text("\\(participant.name) connected")', 'Text(iroh.connectedPeerCount == 1 ? "1 peer connected" : "\\(iroh.connectedPeerCount) peers connected")'),
              ('Text("Use while both sides are idle")', 'Text("Measures one peer while the group is idle")'),
              ('Text("Only one Mac needs to initiate the connection. Once connected, close Settings and use the normal Landline push-to-talk interface.")', 'Text("Add one peer manually; protocol v2 membership then forms direct mesh connections between known group members. Close Settings and use the normal Landline push-to-talk interface.")'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected Settings text not found: {old}')
              text = text.replace(old, new, 1)
          settings.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name "Matt Innes"
          git config user.email "matt@idealogue.io"
          git add LandlineMac/IrohClient.swift LandlineMac/IrohSettingsView.swift
          git diff --cached --check
          git commit -m "Polish multi-user diagnostics"
          git push origin HEAD:feature/macos-multi-user
