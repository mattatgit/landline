name: Apply macOS UI polish

'on':
  push:
    branches:
      - feature/macos-ui-polish
    paths:
      - .github/workflows/apply-macos-ui-polish.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/macos-ui-polish

      - name: Apply UI polish
        run: python3 .github/scripts/apply_macos_ui_polish.py

      - name: Verify patch formatting
        run: git diff --check

      - name: Build Apple Silicon Release app
        run: >-
          xcodebuild
          -project LandlineMac.xcodeproj
          -scheme LandlineMac
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/LandlineDerivedData"
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Verify arm64 executable
        run: >-
          file "$RUNNER_TEMP/LandlineDerivedData/Build/Products/Release/LandlineMac.app/Contents/MacOS/LandlineMac"
          | grep -q 'arm64'

      - name: Commit polished UI
        run: |
          git config user.name "Matt Innes"
          git config user.email "matt@idealogue.io"
          git add LandlineMac/ContentView.swift LandlineMac/DesignTokens.swift LandlineMac/LandlineMacApp.swift
          git diff --cached --check
          git commit -m "Polish macOS window and modal presentation"
          git push origin HEAD:feature/macos-ui-polish
