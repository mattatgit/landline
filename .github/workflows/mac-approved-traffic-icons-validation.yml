name: Validate approved macOS traffic light icons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mac-approved-traffic-icons-validation.yml'

permissions:
  contents: write

jobs:
  build-test:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16.2
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Apply approved icons
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_approved_traffic_icons.py
          git diff --check

      - name: Commit source update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LandlineMac/LandlineMacApp.swift docs/CURRENT.md
          git commit -m "Use approved traffic light hover icons"
          git push origin HEAD:main

      - name: Resolve packages
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project LandlineMac.xcodeproj \
            -scheme LandlineMac \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: Build Apple Silicon Release
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project LandlineMac.xcodeproj \
            -scheme LandlineMac \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/LandlineDerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Verify, sign and package
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/LandlineDerivedData/Build/Products/Release/LandlineMac.app"
          BIN="$APP/Contents/MacOS/LandlineMac"
          test -d "$APP"
          test -x "$BIN"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          file "$BIN" | tee "$RUNNER_TEMP/file.txt"
          grep -q 'arm64' "$RUNNER_TEMP/file.txt"
          xattr -cr "$APP"
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=4 "$APP"
          ZIP='LandlineMac-arm64-approved-traffic-icons.zip'
          ditto -c -k --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          mkdir -p "$RUNNER_TEMP/roundtrip"
          ditto -x -k "$ZIP" "$RUNNER_TEMP/roundtrip"
          xattr -cr "$RUNNER_TEMP/roundtrip/LandlineMac.app"
          codesign --verify --deep --strict --verbose=4 "$RUNNER_TEMP/roundtrip/LandlineMac.app"

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: LandlineMac-arm64-approved-traffic-icons
          path: |
            LandlineMac-arm64-approved-traffic-icons.zip
            LandlineMac-arm64-approved-traffic-icons.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary validation files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/mac-approved-traffic-icons-validation.yml
          rm -f .github/scripts/apply_approved_traffic_icons.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/mac-approved-traffic-icons-validation.yml .github/scripts/apply_approved_traffic_icons.py
          git commit -m "Remove approved traffic icon validation helpers"
          git push origin HEAD:main
