name: Linux Nix build

on:
  push:
    branches: [linux-nix]
    paths:
      - 'LandlineNix/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/linux-nix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: linux-nix
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build Linux client inside Nix shell
        run: nix develop --command cargo build --release --manifest-path LandlineNix/Cargo.toml

      - name: Record resolved lock files
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain -- LandlineNix/Cargo.lock flake.lock)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add LandlineNix/Cargo.lock flake.lock
            git commit -m "Lock Linux build dependencies"
            git push origin HEAD:linux-nix
          fi

      - name: Build Nix application package
        run: nix build .#landline -L

      - name: Create portable Nix bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist landline-bundle
          mkdir -p dist
          nix bundle .#landline -o landline-bundle
          cp -L landline-bundle dist/Landline-NixOS-x86_64
          chmod +x dist/Landline-NixOS-x86_64
          tar -C dist -czf dist/Landline-NixOS-x86_64.tar.gz Landline-NixOS-x86_64
          (
            cd dist
            sha256sum Landline-NixOS-x86_64 Landline-NixOS-x86_64.tar.gz > SHA256SUMS
          )

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Landline-NixOS-x86_64
          path: |
            dist/Landline-NixOS-x86_64
            dist/Landline-NixOS-x86_64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish Nix preview release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          git tag -f nix-preview "$head_sha"
          git push --force origin refs/tags/nix-preview

          notes=$(cat <<EOF
          Preview build of the native Landline NixOS client from \`linux-nix\`.

          **Easiest download:** \`Landline-NixOS-x86_64.tar.gz\`

          Extract it and launch \`Landline-NixOS-x86_64\`. The executable is a self-contained Nix bundle; Rust, Cargo and a source checkout are not required.

          Build commit: \`$head_sha\`
          EOF
          )

          if gh release view nix-preview >/dev/null 2>&1; then
            gh release edit nix-preview \
              --title "Landline NixOS Preview" \
              --notes "$notes" \
              --prerelease
          else
            gh release create nix-preview \
              --title "Landline NixOS Preview" \
              --notes "$notes" \
              --prerelease
          fi

          gh release upload nix-preview \
            dist/Landline-NixOS-x86_64 \
            dist/Landline-NixOS-x86_64.tar.gz \
            dist/SHA256SUMS \
            --clobber
