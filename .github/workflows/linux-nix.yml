name: Linux Nix build

on:
  push:
    branches: [linux-nix]
    paths:
      - 'LandlineNix/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/linux-nix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: linux-nix
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build Linux client and verify rebuild safety
        shell: bash
        run: |
          set -euo pipefail
          nix develop --command bash -c '
            set -euo pipefail
            cargo build --release --manifest-path LandlineNix/Cargo.toml

            # Reproduce the stale-permission condition from older builds: the
            # previous build script copied Nix-store font permissions into
            # Cargo OUT_DIR, leaving these generated files read-only.
            find LandlineNix/target/release/build -path "*/out/InterTight.ttf" -exec chmod 0444 {} +
            find LandlineNix/target/release/build -path "*/out/Inter.ttf" -exec chmod 0444 {} +

            # Force the build script to rerun in the same Cargo target tree.
            touch LandlineNix/build.rs
            cargo build --release --manifest-path LandlineNix/Cargo.toml
          '

      - name: Record resolved lock files
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain -- LandlineNix/Cargo.lock flake.lock)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add LandlineNix/Cargo.lock flake.lock
            git commit -m "Lock Linux build dependencies"
            git push origin HEAD:linux-nix
          fi

      - name: Build Nix application package
        run: nix build .#landline -L
