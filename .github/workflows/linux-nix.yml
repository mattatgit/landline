name: Linux Nix build

on:
  push:
    branches: [linux-nix]
    paths:
      - 'LandlineNix/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/linux-nix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: linux-nix
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Check Linux client inside Nix shell
        run: nix develop --command cargo check --manifest-path LandlineNix/Cargo.toml

      - name: Record resolved lock files
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain -- LandlineNix/Cargo.lock flake.lock)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add LandlineNix/Cargo.lock flake.lock
            git commit -m "Lock Linux build dependencies"
            git push origin HEAD:linux-nix
          fi
