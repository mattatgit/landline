name: Fix macOS blur edge

on:
  push:
    branches:
      - feature/macos-ui-polish
    paths:
      - .github/workflows/fix-macos-blur-edge.yml
      - .github/scripts/fix_blur_edge.py

permissions:
  contents: write

jobs:
  apply-build-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/macos-ui-polish

      - name: Apply blur edge fix
        run: python3 .github/scripts/fix_blur_edge.py

      - name: Verify patch formatting
        run: git diff --check

      - name: Build Apple Silicon Release app
        run: |
          set -euo pipefail
          xcodebuild \
            -project LandlineMac.xcodeproj \
            -scheme LandlineMac \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/LandlineDerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Sign and package test build
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/LandlineDerivedData/Build/Products/Release/LandlineMac.app"
          ZIP="$RUNNER_TEMP/LandlineMac-UI-Polish-BlurEdge-Test-2026-09-10.zip"
          VERIFY="$RUNNER_TEMP/verify-package"
          test -d "$APP"
          file "$APP/Contents/MacOS/LandlineMac" | grep -q 'arm64'
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          mkdir -p "$VERIFY"
          ditto -x -k "$ZIP" "$VERIFY"
          codesign --verify --deep --strict --verbose=2 "$VERIFY/LandlineMac.app"
          file "$VERIFY/LandlineMac.app/Contents/MacOS/LandlineMac" | grep -q 'arm64'

      - name: Commit blur edge fix
        run: |
          git config user.name "Matt Innes"
          git config user.email "matt@idealogue.io"
          git add LandlineMac/LandlineMacApp.swift
          git diff --cached --check
          git commit -m "Align native blur with window edge"
          git push origin HEAD:feature/macos-ui-polish

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: LandlineMac-UI-Polish-BlurEdge-Test-2026-09-10
          path: ${{ runner.temp }}/LandlineMac-UI-Polish-BlurEdge-Test-2026-09-10.zip
          if-no-files-found: error
          retention-days: 14
