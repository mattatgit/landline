name: Fix egui viewport API

on:
  push:
    branches: [linux-nix]
    paths:
      - '.github/workflows/fix-egui-viewport.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: linux-nix
          fetch-depth: 0
      - name: Patch egui 0.31 viewport commands
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/ui\.send_viewport_cmd/ui.ctx().send_viewport_cmd/g' LandlineNix/src/ui.rs
          grep -q 'ui.ctx().send_viewport_cmd' LandlineNix/src/ui.rs
          rm .github/workflows/fix-egui-viewport.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix egui viewport commands"
          git push origin HEAD:linux-nix
