name: Fix Linux profile borrow

on:
  push:
    branches:
      - linux-nix
    paths:
      - '.github/workflows/fix-profile-borrow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: linux-nix
      - name: Apply borrow fix
        run: python3 scripts/fix_profile_borrow.py
      - name: Commit fix
        run: |
          rm .github/workflows/fix-profile-borrow.yml
          rm scripts/fix_profile_borrow.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Linux profile sheet borrow"
          git push origin HEAD:linux-nix
